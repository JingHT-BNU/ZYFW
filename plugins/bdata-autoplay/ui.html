<div class="zy-config" id="bnu-ui">
  <div class="zy-alert zy-warn">
    BNU刷课使用全局设置中的北师大统一身份认证账号，分别登录师道云和 SPOC。
    首次使用或切换账号后，请先获取课程详情。师道云的模型生成内容默认需要人工核验。
  </div>

  <div class="zy-row">
    <button class="zy-btn zy-primary" id="bnu-refresh">获取课程详情</button>
    <button class="zy-btn" id="bnu-save">保存设置</button>
    <span class="zy-hint" id="bnu-cache-meta">尚未读取课程缓存</span>
  </div>

  <div class="zy-alert">
    <div id="bnu-course-plans" class="bdata-course-plans">
      <div class="zy-hint">正在读取课程缓存…</div>
    </div>
  </div>

  <div class="zy-row">
    <div class="zy-field">
      <label>运行设置</label>
      <label class="zy-hint"><input type="checkbox" id="bnu-headless"> 无头模式</label>
      <label class="zy-hint"><input type="checkbox" id="bnu-unfinished"> 只处理未完成视频</label>
    </div>
    <div class="zy-field">
      <label>并发浏览器数</label>
      <input type="number" id="bnu-workers" min="1" step="1">
    </div>
    <div class="zy-field">
      <label>播放倍速</label>
      <input type="number" id="bnu-speedup" min="1" max="3" step="0.5">
    </div>
    <div class="zy-field">
      <label>完成容差（秒）</label>
      <input type="number" id="bnu-tolerance" min="0" max="30" step="1">
      <span class="zy-hint">仅对师道云生效</span>
    </div>
  </div>

  <div class="zy-row">
    <div class="zy-field">
      <label>自动化能力（仅师道云）</label>
      <label class="zy-hint"><input type="checkbox" id="bnu-auto-answer"> 自动答题</label>
      <label class="zy-hint"><input type="checkbox" id="bnu-comment-reply"> 评论回复</label>
    </div>
  </div>

  <div id="bnu-qa-settings" hidden>
    <div class="zy-row">
      <div class="zy-field">
        <label>提交方式</label>
        <label class="zy-hint">
          <input type="checkbox" id="bnu-full-auto"> 全自动模式（跳过人工核验）
        </label>
      </div>
    </div>
    <div class="zy-alert zy-error" id="bnu-full-auto-warning" hidden>
      危险：全自动模式会把模型生成的测验答案、评论和回复直接提交。
      每次启动任务前仍会强制弹窗确认。
    </div>
    <div class="zy-row">
      <div class="zy-field bdata-wide">
        <label>OpenAI Chat 兼容 API 地址</label>
        <input type="text" id="bnu-api-url" placeholder="https://api.deepseek.com">
      </div>
    </div>
    <div class="zy-row">
      <div class="zy-field bdata-wide">
        <label>API Key（加密保存）</label>
        <input type="password" id="bnu-api-key" autocomplete="new-password"
          placeholder="已加密存储">
      </div>
      <div class="zy-field">
        <label>模型 ID</label>
        <input type="text" id="bnu-model-id" placeholder="deepseek-flash">
      </div>
    </div>
    <div class="zy-row">
      <div class="zy-field">
        <label>量表答题策略</label>
        <select id="bnu-survey-strategy">
          <option value="fixed">固定正负策略</option>
          <option value="normal">正态分布策略</option>
        </select>
      </div>
      <div class="zy-field" id="bnu-survey-fixed">
        <label>正向题固定选择</label>
        <select id="bnu-survey-positive">
          <option value="0">非常不同意</option>
          <option value="1">不同意</option>
          <option value="2">一般</option>
          <option value="3">同意</option>
          <option value="4">非常同意</option>
        </select>
      </div>
      <div class="zy-field" id="bnu-survey-negative-field">
        <label>负向题固定选择</label>
        <select id="bnu-survey-negative">
          <option value="0">非常不同意</option>
          <option value="1">不同意</option>
          <option value="2">一般</option>
          <option value="3">同意</option>
          <option value="4">非常同意</option>
        </select>
      </div>
    </div>
    <div class="zy-hint" id="bnu-survey-normal-hint" hidden>
      以“一般”为均值，约 2 倍标准差映射为“同意/不同意”，
      约 3 倍标准差映射为“非常同意/非常不同意”；每题独立随机选择。
    </div>
    <div class="zy-hint">
      量表题自动填写且不出现在核验区。SPOC 自动答题暂未开发。
    </div>
  </div>

  <div class="zy-alert zy-warn" id="bnu-review" hidden>
    <strong id="bnu-review-title">等待核验</strong>
    <div class="zy-hint" id="bnu-review-meta"></div>
    <div class="zy-review-context" id="bnu-review-context"></div>
    <div class="zy-review-fields" id="bnu-review-fields"></div>
    <div class="zy-row">
      <button class="zy-btn zy-primary" id="bnu-approve">确认并提交</button>
      <button class="zy-btn" id="bnu-skip">跳过本项</button>
      <span class="zy-hint">请先修改需要调整的答案，再确认提交。</span>
    </div>
  </div>

  <div id="bnu-progress-panel" hidden>
    <div class="zy-row">
      <strong>刷课分线程进度</strong>
      <span class="zy-hint" id="bnu-overall-progress"></span>
    </div>
    <div class="bnu-worker-grid" id="bnu-workers"></div>
  </div>

  <div class="zy-alert" id="bnu-msg" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var Z = window.ZyfwConfigUI;
  if (!Z) return;
  var $ = function (id) { return document.getElementById(id); };
  var pluginId = "bdata-autoplay";
  var configuredPlans = {};
  var requestId = "";
  var currentFields = [];
  var sending = false;
  var cacheTimer = null;
  var progressTimer = null;
  var saveTimer = null;
  var latestProgress = null;

  function showMsg(text, cls) {
    var el = $("bnu-msg");
    if (!el) return;
    el.textContent = text;
    el.className = "zy-alert" + (cls ? " " + cls : "");
    el.hidden = false;
  }

  function platformName(course) {
    return course.platform === "spoc" ? "SPOC" : "师道云";
  }

  function courseSummary(course) {
    var videos = [];
    var exams = [];
    (course.chapters || []).forEach(function (chapter) {
      videos = videos.concat(chapter.videos || []);
      exams = exams.concat(chapter.exams || []);
    });
    var finished = videos.filter(function (video) {
      return video.finished === true;
    }).length;
    if (course.platform === "spoc") {
      return "视频 " + finished + "/" + videos.length +
        " · 作业/测试 " + exams.length;
    }
    var tasksDone = (course.tasks || []).filter(function (task) {
      return task.finished === true;
    }).length;
    return "任务 " + tasksDone + "/" + (course.tasks || []).length +
      " · 视频 " + videos.length;
  }

  function taskSummary(task) {
    var parts = [task.finished ? "已完成" : "未完成"];
    if (task.total_video_progress !== null
        && task.total_video_progress !== undefined) {
      parts.push("视频 " + task.total_video_progress + "%");
    }
    if (task.questionnaire_progress) parts.push("问卷完成");
    if (task.commit_progress) parts.push("评论完成");
    if (task.reply_progress) parts.push("回复完成");
    var videoCount = 0;
    var examCount = 0;
    Object.values(task.videos || {}).forEach(function (items) {
      videoCount += items.length;
    });
    Object.values(task.exams || {}).forEach(function (items) {
      examCount += items.length;
    });
    if (videoCount) parts.push("视频 " + videoCount);
    if (examCount) {
      parts.push("测试 " + (task.exam_progress || 0) + "/" + examCount);
    }
    return parts.join(" · ");
  }

  function normalizeChapters(rawChapters, prefix) {
    return Object.keys(rawChapters || {}).sort(function (a, b) {
      return Number(a) - Number(b);
    }).map(function (key) {
      var chapter = rawChapters[key] || {};
      return {
        id: prefix + ":chapter:" + key,
        key: String(key),
        name: chapter.name || "",
        xpath: chapter.XPATH || "",
        videos: Object.keys(chapter.videos || {}).sort(function (a, b) {
          return Number(a) - Number(b);
        }).map(function (videoKey) {
          return Object.assign({}, chapter.videos[videoKey], {
            key: String(videoKey)
          });
        }),
        exams: Object.keys(chapter.exams || {}).sort(function (a, b) {
          return Number(a) - Number(b);
        }).map(function (examKey) {
          return Object.assign({}, chapter.exams[examKey], {
            key: String(examKey)
          });
        })
      };
    });
  }

  function normalizeCourses(data) {
    var courses = [];
    Object.keys((data && data.bdata) || {}).forEach(function (cid) {
      var raw = data.bdata[cid] || {};
      courses.push({
        id: "bdata:" + cid,
        platform: "bdata",
        cid: cid,
        title: raw.name || cid,
        chapters: normalizeChapters(raw.chapters, "bdata:" + cid),
        tasks: (raw.tasks || []).map(function (task, index) {
          return Object.assign({}, task, { id: String(index) });
        })
      });
    });
    ((data && data.spoc) || []).forEach(function (raw) {
      var chapters = normalizeChapters(raw.chapters, raw.url || raw.name);
      courses.push({
        id: raw.url || raw.name,
        platform: "spoc",
        title: raw.name || raw.url,
        url: raw.url || "",
        chapters: chapters,
        tasks: [],
        has_tasks: chapters.some(function (chapter) {
          return (chapter.videos || []).length > 0;
        })
      });
    });
    return courses;
  }

  function choiceRow(className, value, title, detail) {
    var label = document.createElement("label");
    label.className = "bdata-task-option";
    var input = document.createElement("input");
    input.type = "checkbox";
    input.className = className;
    input.value = value;
    label.appendChild(input);
    var copy = document.createElement("span");
    copy.className = "bdata-task-copy";
    var head = document.createElement("span");
    head.className = "bdata-task-title";
    head.textContent = title;
    copy.appendChild(head);
    if (detail) {
      var meta = document.createElement("span");
      meta.className = "bdata-task-meta";
      meta.textContent = detail;
      copy.appendChild(meta);
    }
    label.appendChild(copy);
    return label;
  }

  function makeCoursePlan(course, plan) {
    plan = plan && typeof plan === "object" ? plan : {};
    var availableTaskIds = (course.tasks || []).map(function (task) {
      return String(task.id);
    });
    var availableChapterIds = (course.chapters || []).map(function (chapter) {
      return String(chapter.id);
    });
    if (plan.scope === "selected"
        && !(plan.task_ids || []).some(function (id) {
          return availableTaskIds.indexOf(String(id)) >= 0;
        })) {
      plan = Object.assign({}, plan, {scope: "all"});
    }
    if (plan.scope === "chapters"
        && !(plan.chapter_ids || []).some(function (id) {
          return availableChapterIds.indexOf(String(id)) >= 0;
        })) {
      plan = Object.assign({}, plan, {scope: "all"});
    }
    var card = document.createElement("div");
    card.className = "bdata-course-plan";
    card.setAttribute("data-course-id", course.id);

    var head = document.createElement("div");
    head.className = "zy-row bdata-plan-head";
    var titleLabel = document.createElement("label");
    titleLabel.className = "bdata-plan-title";
    var enabled = document.createElement("input");
    enabled.type = "checkbox";
    enabled.className = "bnu-course-enabled";
    enabled.checked = plan.enabled !== false;
    titleLabel.appendChild(enabled);
    var title = document.createElement("strong");
    title.textContent = course.title || course.cid || "未命名课程";
    titleLabel.appendChild(title);
    var platform = document.createElement("span");
    platform.className = "bnu-platform " + course.platform;
    platform.textContent = platformName(course);
    titleLabel.appendChild(platform);
    head.appendChild(titleLabel);
    var meta = document.createElement("span");
    meta.className = "zy-hint";
    meta.textContent = courseSummary(course);
    head.appendChild(meta);
    card.appendChild(head);

    var scope = document.createElement("select");
    scope.className = "bnu-course-scope";
    var choices = course.platform === "spoc" ? [
      ["all", "刷全部课程"],
      ["chapters", "刷指定章节"]
    ] : [
      ["selected", "刷指定任务"],
      ["all", "刷全部任务"],
      ["all_extra", "全部任务 + 任务外视频"],
      ["chapters", "刷指定章节"]
    ];
    choices.forEach(function (entry) {
      var option = document.createElement("option");
      option.value = entry[0];
      option.textContent = entry[1];
      option.selected = (plan.scope || "all") === entry[0];
      scope.appendChild(option);
    });
    head.appendChild(scope);

    var taskList = document.createElement("div");
    taskList.className = "bdata-task-list";
    var taskIds = Array.isArray(plan.task_ids) ? plan.task_ids.map(String) : [];
    (course.tasks || []).forEach(function (task) {
      var row = choiceRow(
        "bnu-task-check", String(task.id),
        task.description || task.name || "未命名任务",
        taskSummary(task));
      row.querySelector("input").checked = taskIds.indexOf(String(task.id)) >= 0;
      taskList.appendChild(row);
    });
    card.appendChild(taskList);

    var chapterList = document.createElement("div");
    chapterList.className = "bdata-task-list";
    var chapterIds = Array.isArray(plan.chapter_ids)
      ? plan.chapter_ids.map(String) : [];
    (course.chapters || []).forEach(function (chapter) {
      var videos = chapter.videos || [];
      var row = choiceRow(
        "bnu-chapter-check", String(chapter.id),
        chapter.name || "未命名章节",
        "视频 " + videos.length);
      row.querySelector("input").checked =
        chapterIds.indexOf(String(chapter.id)) >= 0;
      chapterList.appendChild(row);
    });
    card.appendChild(chapterList);

    function syncVisibleLists() {
      taskList.hidden = scope.value !== "selected";
      chapterList.hidden = scope.value !== "chapters";
    }
    scope.addEventListener("change", syncVisibleLists);
    scope.addEventListener("change", scheduleSave);
    enabled.addEventListener("change", function () {
      card.classList.toggle("is-disabled", !enabled.checked);
      scheduleSave();
    });
    card.querySelectorAll(".bdata-task-option input").forEach(function (input) {
      input.addEventListener("change", scheduleSave);
    });
    syncVisibleLists();
    card.classList.toggle("is-disabled", !enabled.checked);
    return card;
  }

  function renderCourses(data, plans) {
    configuredPlans = plans || {};
    var root = $("bnu-course-plans");
    root.textContent = "";
    var courses = normalizeCourses(data);
    var hiddenEmpty = 0;
    var visible = courses.filter(function (course) {
      if (course.platform === "spoc" && !course.has_tasks) {
        hiddenEmpty += 1;
        return false;
      }
      return true;
    }).sort(function (a, b) {
      if (a.platform !== b.platform) return a.platform === "spoc" ? -1 : 1;
      return String(a.title || "").localeCompare(String(b.title || ""), "zh-CN");
    });
    if (!visible.length) {
      var empty = document.createElement("div");
      empty.className = "zy-hint";
      empty.textContent = "当前账号尚无可用课程缓存，请点击“获取课程详情”。";
      root.appendChild(empty);
    } else {
      visible.forEach(function (course) {
        var plan = configuredPlans[course.id];
        if (!plan && course.cid) plan = configuredPlans[course.cid];
        root.appendChild(makeCoursePlan(course, plan));
      });
    }
    var account = data && data.account ? "账号 " + data.account + " · " : "";
    var updated = data && data.updated_at ? "更新于 " + data.updated_at : "尚未缓存";
    var emptyText = hiddenEmpty ? " · SPOC 无任务课程 " + hiddenEmpty + " 门已隐藏" : "";
    $("bnu-cache-meta").textContent = account + updated +
      " · 可选课程 " + visible.length + " 门" + emptyText;
  }

  function collectPlans() {
    var plans = {};
    document.querySelectorAll(".bdata-course-plan").forEach(function (card) {
      var courseId = card.getAttribute("data-course-id");
      if (!courseId) return;
      plans[courseId] = {
        enabled: card.querySelector(".bnu-course-enabled").checked,
        scope: card.querySelector(".bnu-course-scope").value,
        task_ids: Array.from(
          card.querySelectorAll(".bnu-task-check:checked")
        ).map(function (input) { return input.value; }),
        chapter_ids: Array.from(
          card.querySelectorAll(".bnu-chapter-check:checked")
        ).map(function (input) { return input.value; })
      };
    });
    return plans;
  }

  function collectConfig(validate) {
    var cfg = {
      course_plans: collectPlans(),
      auto_answer: $("bnu-auto-answer").checked,
      comment_reply: $("bnu-comment-reply").checked,
      full_auto: $("bnu-full-auto").checked,
      only_unfinished: $("bnu-unfinished").checked,
      workers: Math.max(1, Number($("bnu-workers").value) || 1),
      speedup: Math.min(3, Math.max(1, Number($("bnu-speedup").value) || 3)),
      completion_tolerance: Math.max(
        0, Number($("bnu-tolerance").value) || 0),
      headless: $("bnu-headless").checked,
      api_url: $("bnu-api-url").value.trim(),
      api_key: $("bnu-api-key").value,
      model_id: $("bnu-model-id").value.trim(),
      survey_strategy: $("bnu-survey-strategy").value,
      survey_positive_value: $("bnu-survey-positive").value,
      survey_negative_value: $("bnu-survey-negative").value
    };
    if (!validate) return cfg;
    var enabled = Object.keys(cfg.course_plans).filter(function (id) {
      var plan = cfg.course_plans[id];
      if (!plan.enabled) return false;
      if (plan.scope === "selected" && !plan.task_ids.length) {
        throw new Error("有课程选择了“刷指定任务”，但未勾选任务");
      }
      if (plan.scope === "chapters" && !plan.chapter_ids.length) {
        throw new Error("有课程选择了“刷指定章节”，但未勾选章节");
      }
      return true;
    });
    if (!enabled.length) {
      throw new Error("请至少启用一门课程并选择刷课范围");
    }
    if ((cfg.auto_answer || cfg.comment_reply) && !cfg.api_key.trim()) {
      throw new Error("启用师道云自动答题或评论回复前，请填写模型 API Key");
    }
    return cfg;
  }

  function syncAutomation() {
    var enabled = $("bnu-auto-answer").checked
      || $("bnu-comment-reply").checked;
    $("bnu-qa-settings").hidden = !enabled;
    if (!enabled) {
      $("bnu-full-auto").checked = false;
      $("bnu-full-auto-warning").hidden = true;
    }
  }

  function syncSurveyStrategy() {
    var normal = $("bnu-survey-strategy").value === "normal";
    $("bnu-survey-fixed").hidden = normal;
    $("bnu-survey-negative-field").hidden = normal;
    $("bnu-survey-normal-hint").hidden = !normal;
  }

  function confirmFullAuto() {
    return Z.confirm(
      "危险：全自动模式会跳过人工核验，直接提交模型生成的师道云测验答案、评论和回复。",
      "危险：全自动提交",
      {
        confirmButtonText: "我已了解，启用",
        cancelButtonText: "取消",
        closeOnClickModal: false,
        closeOnPressEscape: false
      });
  }

  async function save(validate, confirmAuto, silent) {
    try {
      var cfg = collectConfig(validate !== false);
      if (validate !== false && confirmAuto !== false
          && cfg.full_auto && !(await confirmFullAuto())) {
        $("bnu-full-auto").checked = false;
        return false;
      }
      await Z.saveConfig(cfg);
      if (!silent) Z.message("success", "BNU刷课设置已保存");
      return true;
    } catch (e) {
      Z.message("error", "保存失败: " + e.message);
      return false;
    }
  }

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      save(false, true, true);
    }, 250);
  }

  async function loadCache(plans) {
    try {
      var data = await Z.api("plugins/" + pluginId + "/tasks");
      renderCourses(data, plans || configuredPlans);
      return data;
    } catch (e) {
      renderCourses(null, plans || configuredPlans);
      return null;
    }
  }

  function stopCacheWatch() {
    if (cacheTimer) clearInterval(cacheTimer);
    cacheTimer = null;
  }

  function watchRefresh() {
    stopCacheWatch();
    var everRunning = false;
    $("bnu-refresh").disabled = true;
    cacheTimer = setInterval(async function () {
      if (!document.getElementById("bnu-refresh")) {
        stopCacheWatch();
        return;
      }
      try {
        var data = await Z.api("plugins");
        var plugin = (data.plugins || []).find(function (item) {
          return item.id === pluginId;
        });
        var running = !!(plugin && plugin.running);
        if (running) {
          everRunning = true;
          var progress = plugin.progress || {};
          $("bnu-cache-meta").textContent = progress.title
            ? "正在获取课程详情 · " + progress.title
            : "正在登录两个平台并获取课程详情…";
          return;
        }
        if (!everRunning) return;
        stopCacheWatch();
        $("bnu-refresh").disabled = false;
        await loadCache();
        Z.message(
          plugin && plugin.status === "crashed" ? "error" : "success",
          plugin && plugin.status === "crashed"
            ? "课程详情获取失败，请查看下方日志"
            : "课程详情已更新");
      } catch (e) {
        /* Keep polling. */
      }
    }, 1800);
  }

  async function refreshCourses() {
    if (!(await save(false))) return;
    $("bnu-refresh").disabled = true;
    $("bnu-cache-meta").textContent = "正在登录师道云和 SPOC…";
    try {
      await Z.post("plugins/" + pluginId + "/tasks/refresh");
      watchRefresh();
    } catch (e) {
      $("bnu-refresh").disabled = false;
      $("bnu-cache-meta").textContent = "获取失败：" + e.message;
      Z.message("error", e.message);
    }
  }

  function optionList(field) {
    return Array.isArray(field.options) ? field.options : [];
  }

  function addReviewField(container, field) {
    var card = document.createElement("div");
    card.className = "zy-review-field";
    var label = document.createElement("label");
    label.textContent = field.label || field.key || "题目";
    card.appendChild(label);
    var type = field.type || "text";
    var value = field.value;
    if (type === "single" || type === "scale") {
      var select = document.createElement("select");
      select.dataset.key = field.key;
      select.dataset.type = type;
      optionList(field).forEach(function (option) {
        var item = document.createElement("option");
        item.value = String(option.value);
        item.textContent = option.label || option.value;
        item.selected = String(option.value) === String(value);
        select.appendChild(item);
      });
      card.appendChild(select);
    } else if (type === "multiple") {
      var group = document.createElement("div");
      group.className = "zy-review-options";
      group.dataset.key = field.key;
      group.dataset.type = type;
      var selected = Array.isArray(value) ? value.map(String) : [];
      optionList(field).forEach(function (option) {
        var optionLabel = document.createElement("label");
        optionLabel.className = "zy-hint";
        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = String(option.value);
        checkbox.checked = selected.indexOf(String(option.value)) >= 0;
        optionLabel.appendChild(checkbox);
        optionLabel.appendChild(document.createTextNode(
          " " + (option.label || option.value)));
        group.appendChild(optionLabel);
      });
      card.appendChild(group);
    } else {
      var textarea = document.createElement("textarea");
      textarea.rows = 5;
      textarea.dataset.key = field.key;
      textarea.dataset.type = type;
      textarea.value = String(value || "");
      card.appendChild(textarea);
    }
    container.appendChild(card);
  }

  function renderReview(request) {
    if (!request) {
      requestId = "";
      currentFields = [];
      $("bnu-review").hidden = true;
      return;
    }
    if (request.id === requestId) return;
    requestId = request.id;
    currentFields = Array.isArray(request.fields)
      ? request.fields.filter(function (field) {
        return field.type !== "scale";
      }) : [];
    $("bnu-review-title").textContent = request.title || "等待核验";
    $("bnu-review-meta").textContent = request.kind === "quiz"
      ? "请核对模型答案。量表题已自动填写并隐藏。"
      : "请核对评论和回复；确认后才会发表。";
    var context = $("bnu-review-context");
    context.textContent = "";
    (request.context || []).forEach(function (line) {
      var item = document.createElement("div");
      item.className = "zy-review-context-line";
      item.textContent = line;
      context.appendChild(item);
    });
    var fields = $("bnu-review-fields");
    fields.textContent = "";
    currentFields.forEach(function (field) {
      addReviewField(fields, field);
    });
    $("bnu-approve").disabled = false;
    $("bnu-skip").disabled = false;
    $("bnu-review").hidden = false;
  }

  function reviewedPayload() {
    var root = $("bnu-review-fields");
    return {
      fields: currentFields.map(function (field) {
        var key = String(field.key);
        var type = field.type || "text";
        var value = "";
        if (type === "single" || type === "scale") {
          var select = root.querySelector(
            'select[data-key="' + CSS.escape(key) + '"]');
          value = select ? select.value : String(field.value || "");
        } else if (type === "multiple") {
          var group = root.querySelector(
            'div[data-key="' + CSS.escape(key) + '"]');
          value = group ? Array.from(
            group.querySelectorAll("input:checked")
          ).map(function (el) { return el.value; }) : [];
        } else {
          var area = root.querySelector(
            'textarea[data-key="' + CSS.escape(key) + '"]');
          value = area ? area.value : String(field.value || "");
        }
        return { key: key, value: value };
      })
    };
  }

  async function decide(action) {
    if (!requestId || sending) return;
    sending = true;
    $("bnu-approve").disabled = true;
    $("bnu-skip").disabled = true;
    try {
      await Z.api("plugins/" + pluginId + "/review", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          request_id: requestId,
          action: action,
          payload: action === "approve"
            ? reviewedPayload() : { fields: [] }
        })
      });
      Z.message("success", action === "approve"
        ? "已确认，插件将继续提交" : "已跳过本项");
    } catch (e) {
      $("bnu-approve").disabled = false;
      $("bnu-skip").disabled = false;
      Z.message("error", e.message);
    } finally {
      sending = false;
    }
  }

  function fmtDuration(value) {
    if (value === null || value === undefined || !isFinite(value)) return "-";
    value = Math.max(0, Math.round(Number(value)));
    var minutes = Math.floor(value / 60);
    var seconds = value % 60;
    return minutes + ":" + String(seconds).padStart(2, "0");
  }

  function workerCard(worker) {
    var card = document.createElement("div");
    card.className = "bnu-worker";
    var head = document.createElement("div");
    head.className = "bnu-worker-head";
    var info = document.createElement("div");
    var platform = document.createElement("span");
    platform.className = "bnu-platform " +
      (worker.platform === "SPOC" ? "spoc" : "bdata");
    platform.textContent = worker.platform || "刷课";
    info.appendChild(platform);
    var title = document.createElement("div");
    title.className = "bnu-worker-title";
    title.textContent = (worker.course ? worker.course + " · " : "") +
      (worker.title || "—");
    title.title = title.textContent;
    info.appendChild(title);
    head.appendChild(info);
    var status = document.createElement("span");
    status.className = "zy-hint";
    status.textContent = worker.status || "";
    head.appendChild(status);
    card.appendChild(head);
    var progress = document.createElement("div");
    progress.className = "zy-progress";
    var bar = document.createElement("div");
    bar.className = "zy-progress-bar";
    bar.style.width = Math.max(0, Math.min(
      100, Number(worker.percent) || 0)) + "%";
    progress.appendChild(bar);
    card.appendChild(progress);
    var meta = document.createElement("div");
    meta.className = "bnu-worker-meta";
    meta.textContent = "服务器进度 " +
      (worker.percent === null || worker.percent === undefined
        ? "-" : worker.percent + "%") +
      " · 时长 " + fmtDuration(worker.total_s) +
      " · 剩余 " + fmtDuration(worker.eta_s) +
      (worker.replays ? " · 重播 " + worker.replays + " 次" : "");
    card.appendChild(meta);
    return card;
  }

  function renderWorkers(progress, plugin) {
    var panel = $("bnu-progress-panel");
    var root = $("bnu-workers");
    if (plugin && plugin.running) {
      panel.hidden = false;
      if (!root.children.length) {
        $("bnu-overall-progress").textContent = "正在启动分线程…";
      }
    }
    if (!progress || !progress.workers) {
      return;
    }
    panel.hidden = false;
    $("bnu-overall-progress").textContent =
      "已完成 " + (progress.done || 0) + "/" + (progress.total || 0);
    root.textContent = "";
    Object.keys(progress.workers)
      .sort(function (a, b) { return Number(a) - Number(b); })
      .forEach(function (key) {
        root.appendChild(workerCard(progress.workers[key]));
      });
  }

  async function pollReviewAndProgress() {
    try {
      var review = await Z.api("plugins/" + pluginId + "/review");
      renderReview(review.request || null);
    } catch (e) { /* Plugin may be idle. */ }
    try {
      var data = await Z.api("plugins");
      var plugin = (data.plugins || []).find(function (item) {
        return item.id === pluginId;
      });
      if (plugin && plugin.progress && plugin.progress.workers) {
        latestProgress = plugin.progress;
      }
      renderWorkers(latestProgress, plugin);
    } catch (e) { /* Ignore transient polling errors. */ }
  }

  async function init() {
    var cfg = await Z.getConfig();
    $("bnu-auto-answer").checked = cfg.auto_answer === true;
    $("bnu-comment-reply").checked = cfg.comment_reply === true;
    $("bnu-full-auto").checked = cfg.full_auto === true;
    $("bnu-unfinished").checked = cfg.only_unfinished !== false;
    $("bnu-workers").value = cfg.workers || 4;
    $("bnu-speedup").value = Math.min(3, cfg.speedup || 3);
    $("bnu-tolerance").value = cfg.completion_tolerance != null
      ? cfg.completion_tolerance : 3;
    $("bnu-headless").checked = cfg.headless !== false;
    $("bnu-api-url").value = cfg.api_url || "https://api.deepseek.com";
    $("bnu-api-key").value = cfg.api_key || "";
    $("bnu-model-id").value = cfg.model_id || "deepseek-flash";
    $("bnu-survey-strategy").value =
      cfg.survey_strategy === "normal" ? "normal" : "fixed";
    $("bnu-survey-positive").value =
      cfg.survey_positive_value != null ? String(cfg.survey_positive_value) : "3";
    $("bnu-survey-negative").value =
      cfg.survey_negative_value != null ? String(cfg.survey_negative_value) : "1";

    $("bnu-auto-answer").addEventListener("change", syncAutomation);
    $("bnu-comment-reply").addEventListener("change", syncAutomation);
    $("bnu-full-auto").addEventListener("change", async function () {
      if ($("bnu-full-auto").checked && !(await confirmFullAuto())) {
        $("bnu-full-auto").checked = false;
      }
      $("bnu-full-auto-warning").hidden = !$("bnu-full-auto").checked;
      await save(false, true, true);
    });
    $("bnu-survey-strategy").addEventListener("change", syncSurveyStrategy);
    [
      "bnu-headless", "bnu-unfinished", "bnu-workers", "bnu-speedup",
      "bnu-tolerance", "bnu-auto-answer", "bnu-comment-reply",
      "bnu-api-url", "bnu-api-key", "bnu-model-id",
      "bnu-survey-strategy", "bnu-survey-positive", "bnu-survey-negative"
    ].forEach(function (id) {
      $(id).addEventListener("change", scheduleSave);
    });
    $("bnu-refresh").addEventListener("click", refreshCourses);
    $("bnu-save").addEventListener("click", function () { save(true); });
    $("bnu-approve").addEventListener("click", function () { decide("approve"); });
    $("bnu-skip").addEventListener("click", function () { decide("skip"); });
    syncAutomation();
    syncSurveyStrategy();
    await loadCache(cfg.course_plans || {});
    await pollReviewAndProgress();
    window.ZyfwBnuSave = function () {
      return save(true, false, true);
    };
    progressTimer = setInterval(pollReviewAndProgress, 700);
    try {
      var data = await Z.api("plugins");
      var plugin = (data.plugins || []).find(function (item) {
        return item.id === pluginId;
      });
      if (plugin && plugin.running && plugin.progress
          && plugin.progress.stage === "cache") {
        watchRefresh();
      }
    } catch (e) { /* Ignore startup state errors. */ }
    window.addEventListener("beforeunload", function () {
      if (progressTimer) clearInterval(progressTimer);
      stopCacheWatch();
      delete window.ZyfwBnuSave;
    });
  }

  init().catch(function (error) {
    showMsg("配置界面初始化失败: " + error.message, "zy-error");
  });
})();
</script>
